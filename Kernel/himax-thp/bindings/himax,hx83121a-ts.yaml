%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/himax,hx83121a-ts.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Himax HX83121A touchscreen controller in host processing mode

maintainers:
  - Detach2233 <101026605+awarson2233@users.noreply.github.com>

description: |
  The HX83121A is a touch and display driver integrated (TDDI) controller. In
  host processing mode it does not compute touch points itself: it streams raw
  capacitance frames over SPI and the host does the touch processing. The touch
  part is powered together with the display, so the controller follows the
  panel it is integrated with.

  A large panel can use two cascaded controllers, each on its own SPI bus with
  its own frame interrupt. The master carries the finger heatmap, owns the
  shared reset line and the host interface select line, and points at the
  slave, which carries the stylus data.

properties:
  compatible:
    enum:
      - himax,hx83121a-ts
      - himax,hx83121a-ts-slave

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1
    description: Frame ready interrupt; the line is held asserted until the
      frame has been read.

  reset-gpios:
    maxItems: 1

  mode-gpios:
    maxItems: 1
    description: Host interface select, sampled by the controller when its
      firmware reloads after a reset. Low selects SPI (host processing), high
      selects I2C-HID. The driver keeps it low.

  panel: true

  himax,cascade:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: The slave controller cascaded with this one.

required:
  - compatible
  - reg
  - interrupts

allOf:
  - $ref: /schemas/spi/spi-peripheral-props.yaml#
  - $ref: touchscreen.yaml#
  - if:
      properties:
        compatible:
          contains:
            const: himax,hx83121a-ts-slave
    then:
      properties:
        reset-gpios: false
        mode-gpios: false
        panel: false
        himax,cascade: false
    else:
      required:
        - reset-gpios

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        touchscreen@0 {
            compatible = "himax,hx83121a-ts";
            reg = <0>;
            spi-max-frequency = <12000000>;

            interrupts-extended = <&tlmm 175 IRQ_TYPE_LEVEL_LOW>;
            reset-gpios = <&tlmm 99 GPIO_ACTIVE_LOW>;
            mode-gpios = <&tlmm 174 GPIO_ACTIVE_HIGH>;

            panel = <&panel>;
            himax,cascade = <&touchscreen_slave>;

            touchscreen-size-x = <25600>;
            touchscreen-size-y = <16000>;
            touchscreen-swapped-x-y;
            touchscreen-inverted-x;
        };
    };

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        touchscreen_slave: touchscreen@0 {
            compatible = "himax,hx83121a-ts-slave";
            reg = <0>;
            spi-max-frequency = <12000000>;

            interrupts-extended = <&tlmm 39 IRQ_TYPE_LEVEL_LOW>;
        };
    };
