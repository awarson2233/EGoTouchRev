# himax-thp 与 linux-gaokun 的 himax-spi 匹配同一个 compatible（himax,hx83121a-ts），udev 会把两个都加载，
# 先注册的那个拿到设备。当前内核装了 himax-thp 时就不加载 himax-spi；没装（比如升级了内核还没重装模块）
# 照常加载 himax-spi，触摸退回原驱动。thp-bind.sh off 用 --ignore-install 绕过这一条。
install himax_hx83121a_spi /bin/sh -c 'modinfo himax_thp >/dev/null 2>&1 || /sbin/modprobe --ignore-install himax_hx83121a_spi $CMDLINE_OPTS'
