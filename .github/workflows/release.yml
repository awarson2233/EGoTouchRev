name: Release

# 每次推到 main：release-please 按 Conventional Commits 维护一个「chore(main): release x.y.z」PR
# （版本号 + CHANGELOG.md）。合并这个 PR 之后，同一个工作流打 tag、建 GitHub Release，再构建安装包传上去。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-installers:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-11-arm
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
      MSI_VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          submodules: recursive

      - uses: ./.github/actions/setup-arm64-toolchain

      - name: Configure
        run: >
          cmake -G Ninja -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_COMPILER_TARGET=arm64-pc-windows-msvc -DCMAKE_CXX_COMPILER_TARGET=arm64-windows-msvc
          -DHIMAX_ENABLE_NEON=ON -DEGO_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Build installers
        shell: pwsh
        run: |
          dotnet tool install --global wix
          wix eula accept wix7
          wix extension add -g WixToolset.UI.wixext

          $out = "build\release-assets"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          wix build -ext WixToolset.UI.wixext -arch arm64 -d BuildVersion=$env:MSI_VERSION scripts\EGoTouchSetup.wxs `
            -loc scripts\zh-CN.wxl -out "$out\EGoTouchSetup_arm64_$env:RELEASE_TAG.msi"
          wix build -ext WixToolset.UI.wixext -arch arm64 -d BuildVersion=$env:MSI_VERSION scripts\EGoTouchTestSetup.wxs `
            -loc scripts\zh-CN.wxl -out "$out\EGoTouchTestSetup_arm64_$env:RELEASE_TAG.msi"

          # wix 会在旁边留下 .wixpdb 调试文件，只发 .msi
          Get-ChildItem $out -Filter *.msi | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)"
          } | Set-Content "$out\SHA256SUMS.txt" -Encoding utf8

      - name: Upload to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:RELEASE_TAG (Get-ChildItem build\release-assets -Include *.msi, SHA256SUMS.txt -File -Recurse).FullName --clobber

  # Linux 安装包：只给自带 himax-thp 的 gaokun3 内核，见 scripts/linux/package/
  build-linux-packages:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04-arm
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Build egotouchd and packages
        shell: bash
        run: |
          scripts/linux/package/ci-build.sh "${{ needs.release-please.outputs.version }}"
          cd build/linux-packages && sha256sum *.deb *.rpm > SHA256SUMS-linux.txt

      - uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: build/linux-packages/*
          if-no-files-found: error

  # 容器里没有 gh，上传放到宿主 runner 上
  upload-linux-packages:
    needs: [release-please, build-linux-packages]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: linux-packages
          path: linux-packages

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" linux-packages/* --clobber --repo "$GITHUB_REPOSITORY"
